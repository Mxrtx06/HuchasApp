
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#cf4f7b">
  <title>Mis huchas</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mis huchas">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icono.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <main id="pantalla-lista" hidden>
    <h1>Mis huchas</h1>
    <div class="lista" id="lista"></div>
  </main>


  <main id="pantalla-nueva" hidden>
    <h1>Nueva hucha</h1>

    <form id="form-meta">
      <label>¿Para qué ahorras?
        <input id="nombre" type="text" placeholder="Viaje a Roma" maxlength="30" required>
      </label>

      <label>Tipo de ahorro
        <select id="tipo">
          <option value="viaje">Viaje</option>
          <option value="ropa">Ropa</option>
          <option value="regalos">Regalos</option>
          <option value="tecnologia">Tecnología</option>
          <option value="otro">Otro</option>
        </select>
      </label>

      <label>Imagen de fondo (opcional)
        <input id="imagen" type="file" accept="image/*">
      </label>

      <label>¿Cuánto quieres conseguir? (€)
        <input id="meta" type="number" min="1" step="0.01" placeholder="800" required>
      </label>

      <button type="submit" class="principal">Crear hucha</button>
      <button type="button" id="cancelar" class="secundario">Cancelar</button>
    </form>
  </main>


  <main id="pantalla-hucha" hidden>
    <button id="volver" class="secundario volver">← Mis huchas</button>

    <h1 id="titulo"></h1>

    <div class="escenario" id="escenario">
      <img id="imagen-cerdito"
           src="otro.png"
           alt="Cerdito de ahorro"
           class="imagen-cerdito">
    </div>

    <p class="cantidad">
      <strong id="ahorrado">0 €</strong>
      de <span id="objetivo">0 €</span>
    </p>

    <div class="barra"
         role="progressbar"
         aria-label="Progreso del ahorro"
         aria-valuemin="0"
         aria-valuemax="100"
         aria-valuenow="0"
         id="barra">
      <div id="relleno"></div>
    </div>

    <p id="mensaje" aria-live="polite"></p>

    <h2>¿Qué metes hoy?</h2>
    <div class="dinero" id="dinero"></div>

    <button id="borrar" class="secundario">Borrar esta hucha</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
